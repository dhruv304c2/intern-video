<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ingested videos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      margin: 2rem;
      background: #f5f6f8;
      color: #1a1a1a;
    }
    h1 { margin-bottom: 0.25rem; }
    h2 {
      margin-top: 2.5rem;
      font-size: 1.1rem;
      color: #444;
      word-break: break-word;
    }
    .scenes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .scene-card {
      background: #fff;
      border: 1px solid #e0e2e6;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .scene-card h3 {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: normal;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eee;
      color: #666;
    }
    .badge.on { background: #dff3e3; color: #1e7d34; }
    .thumbs {
      display: flex;
      gap: 4px;
      margin-bottom: 0.75rem;
    }
    .thumbs img {
      width: 33%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      background: #ddd;
    }
    canvas { max-height: 160px; }
    details { margin-bottom: 0.75rem; font-size: 0.85rem; }
    details pre {
      max-height: 120px;
      overflow: auto;
      background: #f5f6f8;
      border-radius: 6px;
      padding: 0.5rem;
      font-size: 0.75rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>Ingested videos</h1>
  <div id="videos"></div>
  <script src="app.js"></script>
</body>
</html>
